<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("toolbox-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links &mdash; Toolbox</title>
  <meta name="description" content="Quick links to other useful pages and services." />
  <meta property="og:title" content="Links — Toolbox" />
  <meta property="og:description" content="Quick jump-off points to other pages." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#7c5cff" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">🧰</span>
      Toolbox
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="wheel.html">Spin the Wheel</a>
      <a href="timer.html">Timer / Stopwatch</a>
      <a href="qr.html">QR Code</a>
      <a href="links.html" class="active">Links</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">🔗 Links</h1>
    <p class="page-subtitle">Quick jump-off points to other pages.</p>

    <div class="links-grid">
      <a class="link-card" href="https://secrets.nsalabb.se" target="_blank" rel="noopener noreferrer">
        <span class="icon">🤫</span>
        <h2>secrets.nsalabb.se</h2>
        <p>Open secrets.nsalabb.se in a new tab.</p>
      </a>

      <a class="link-card" href="https://kahoot.it" target="_blank" rel="noopener noreferrer">
        <span class="icon">🎮</span>
        <h2>Kahoot</h2>
        <p>Join a Kahoot game at kahoot.it.</p>
      </a>
    </div>
  </main>

  <footer class="site-footer">Toolbox &mdash; simple browser tools</footer>
  <script src="js/theme.js"></script>
  <script src="js/fullscreen.js"></script>
</body>
</html>
